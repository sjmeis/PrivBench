services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./data/datasets:/data/datasets
      - privatized_datasets:/data/privatized_datasets
      - ./modules:/modules
      - ./benchmarks:/benchmarks
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://user:password@db:5432/dbname
      - JWT_SECRET_KEY=REDACTED_JWT_KEY
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Set CLEAN_DB=true to reset database and migrations (development)
      # Set CLEAN_DB=false to preserve database and migrations (production)
      - CLEAN_DB=false
      - POSTGRES_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/app/entrypoint.sh"]

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    hostname: worker1
    volumes:
      - ./data/datasets:/data/datasets
      - privatized_datasets:/data/privatized_datasets
      - ./modules:/modules
      - ./benchmarks:/benchmarks
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/dbname
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - C_FORCE_ROOT=true
    depends_on:
      - redis
      - backend
    entrypoint: ["/app/celery_entrypoint.sh"]
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - REACT_APP_API_URL=https://privbench.com/api

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    working_dir: /data
    command: redis-server --save 60 1 --loglevel notice

volumes:
  postgres_data:
  redis_data:
  privatized_datasets: