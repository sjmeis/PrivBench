services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data/datasets:/data/datasets
      - /home/ubuntu/privbench_data/privatized_datasets:/data/privatized_datasets
      - ./modules:/app/modules
      - ./benchmarks:/app/benchmarks
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/static/uploads:/app/static/uploads
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    user: root
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET_KEY=REDACTED_JWT_KEY
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Set CLEAN_DB=true to reset database and migrations (development)
      # Set CLEAN_DB=false to preserve database and migrations (production)
      - CLEAN_DB=false
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PYTHONDONTWRITEBYTECODE=1
      - PROCFS_PATH=/host/proc
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@privbench.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAIL_SERVER=smtp.web.de
      - MAIL_PORT=587
      - MAIL_USE_TLS=1
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${ADMIN_EMAIL_WEB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/entrypoint.sh"]
    command: ["python3", "-m", "gunicorn", "-w", "2", "-b", "0.0.0.0:5000", "app:app"]

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    hostname: worker1
    volumes:
      - ./data/datasets:/data/datasets
      - /home/ubuntu/privbench_data/privatized_datasets:/data/privatized_datasets
      - ./modules:/app/modules
      - ./benchmarks:/app/benchmarks
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    user: root
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - C_FORCE_ROOT=true
      - HAS_GPU=true
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:64
      - PYTHONDONTWRITEBYTECODE
      - MAIL_SERVER=smtp.web.de
      - MAIL_PORT=587
      - MAIL_USE_TLS=1
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${ADMIN_EMAIL_WEB}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/celery_entrypoint.sh"]
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://privbench.com/api
    expose:
      - "80"
    environment:
      - REACT_APP_API_URL=https://privbench.com/api

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - ./backend/static/uploads:/app/static/uploads:ro
    # ports:
    #   - "80:80"
    #   - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - web-traffic
    labels:
      - "traefik.enable=true"
      - "traver.docker.network=web-traffic"
      - "traefik.http.routers.privbench.rule=Host(`privbench.com`) || Host(`www.privbench.com`)"
      - "traefik.http.routers.privbench.entrypoints=websecure"
      - "traefik.http.routers.privbench.tls=true"
      - "traefik.http.services.privbench.loadbalancer.server.port=80"

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /home/ubuntu/privbench_data/postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    working_dir: /data
    command: redis-server --save 60 1 --loglevel notice

volumes:
  redis_data:

networks:
  web-traffic:
    external: true